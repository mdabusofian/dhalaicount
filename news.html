
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আল ফালাহ মানবসেবা ফাউন্ডেশন - ফটোকার্ড জেনারেটর</title>
    <!-- Kalpurush Font & FontAwesome Icons -->
    <link href="https://fonts.maateen.me/kalpurush/font.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- html2canvas Library for Exporting Image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kalpurush', sans-serif;
        }

        body {
            background-color: #f3f4f6;
            color: #1f2937;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #1e3a8a;
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            color: #4b5563;
            font-size: 16px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        /* Control Panel Form */
        .form-panel {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #374151;
        }

        .form-group input, 
        .form-group textarea, 
        .form-group select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus, 
        .form-group textarea:focus, 
        .form-group select:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn-download {
            width: 100%;
            background-color: #2563eb;
            color: #ffffff;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-download:hover {
            background-color: #1d4ed8;
        }

        /* Preview Panel */
        .preview-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Photo Card Outer Frame (Aspect Ratio 1:1 Square for Social Media) */
        .photocard {
            width: 500px;
            height: 500px;
            background-color: #ffffff;
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            border-radius: 4px;
        }

        /* Top Header Area */
        .card-header-bar {
            height: 60px;
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #ffffff;
            z-index: 2;
        }

        .brand-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #ffffff;
            object-fit: cover;
            border: 2px solid #ffffff;
        }

        .brand-name {
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .card-date {
            font-size: 14px;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 20px;
        }

        /* Image Area (Highlithed News Style) */
        .card-image-box {
            flex: 1;
            position: relative;
            background-color: #e5e7eb;
            overflow: hidden;
        }

        .card-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Category Badge on Image */
        .card-category {
            position: absolute;
            top: 15px;
            left: 20px;
            padding: 4px 14px;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            border-radius: 3px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Bottom Headline Overlay Block */
        .card-headline-box {
            padding: 20px;
            color: #ffffff;
            position: relative;
            min-height: 130px;
            display: flex;
            align-items: center;
        }

        .card-headline-text {
            font-size: 22px;
            line-height: 1.4;
            font-weight: bold;
            width: 100%;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Color Templates Styling */
        
        /* Template 1: Classic Red (Default) */
        .theme-red .card-header-bar { background-color: #b91c1c; }
        .theme-red .card-category { background-color: #b91c1c; }
        .theme-red .card-headline-box { background-color: #991b1b; border-top: 4px solid #f87171; }

        /* Template 2: Professional Blue */
        .theme-blue .card-header-bar { background-color: #1e40af; }
        .theme-blue .card-category { background-color: #1e40af; }
        .theme-blue .card-headline-box { background-color: #1e3a8a; border-top: 4px solid #60a5fa; }

        /* Template 3: Deep Green */
        .theme-green .card-header-bar { background-color: #15803d; }
        .theme-green .card-category { background-color: #15803d; }
        .theme-green .card-headline-box { background-color: #166534; border-top: 4px solid #4ade80; }

        /* Template 4: Dark Premium */
        .theme-dark .card-header-bar { background-color: #111827; }
        .theme-dark .card-category { background-color: #374151; }
        .theme-dark .card-headline-box { background-color: #1f2937; border-top: 4px solid #9ca3af; }

        /* Template 5: Royal Gold */
        .theme-gold .card-header-bar { background-color: #854d0e; }
        .theme-gold .card-category { background-color: #a16207; }
        .theme-gold .card-headline-box { background-color: #713f12; border-top: 4px solid #facc15; }

    </style>
</head>
<body>

    <div class="header">
        <h1>আল ফালাহ মানবসেবা ফাউন্ডেশন</h1>
        <p>নিউজ প্রফেশনাল ফটোকার্ড জেনারেটর টুল</p>
    </div>

    <div class="container">
        <!-- Input Form Section -->
        <div class="form-panel">
            <div class="form-group">
                <label for="templateSelect"><i class="fa-solid fa-palette"></i> কালার টেমপ্লেট নির্বাচন করুন</label>
                <select id="templateSelect" onchange="updateCard()">
                    <option value="theme-red">১. ক্লাসিক লাল (Classic Red)</option>
                    <option value="theme-blue">২. প্রফেশনাল নীল (Professional Blue)</option>
                    <option value="theme-green">৩. গাঢ় সবুজ (Deep Green)</option>
                    <option value="theme-dark">৪. প্রিমিয়াম ডার্ক (Dark Premium)</option>
                    <option value="theme-gold">৫. রয়্যাল গোল্ড (Royal Gold)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="orgNameInput"><i class="fa-solid fa-building-flag"></i> ফাউন্ডেশনের নাম</label>
                <input type="text" id="orgNameInput" value="আল ফালাহ মানবসেবা ফাউন্ডেশন" oninput="updateCard()">
            </div>

            <div class="form-group">
                <label for="categoryInput"><i class="fa-solid fa-layer-group"></i> ক্যাটাগরি</label>
                <input type="text" id="categoryInput" value="ত্রাণ বিতরণ" oninput="updateCard()">
            </div>

            <div class="form-group">
                <label for="dateInput"><i class="fa-solid fa-calendar-days"></i> তারিখ</label>
                <input type="text" id="dateInput" value="১৬ সেপ্টেম্বর, ২০২৬" oninput="updateCard()">
            </div>

            <div class="form-group">
                <label for="headlineInput"><i class="fa-solid fa-newspaper"></i> হেডলাইন / বিবরণ</label>
                <textarea id="headlineInput" rows="3" oninput="updateCard()">বন্যাদুর্গত এলাকায় আল ফালাহ মানবসেবা ফাউন্ডেশনের উদ্যোগে খাদ্য ও জরুরি ত্রাণ সামগ্রী বিতরণ করা হয়েছে।</textarea>
            </div>

            <div class="form-group">
                <label for="mainImageInput"><i class="fa-solid fa-image"></i> মূল ছবি আপলোড করুন (Highlight Image)</label>
                <input type="file" id="mainImageInput" accept="image/*" onchange="loadMainImage(event)">
            </div>

            <div class="form-group">
                <label for="logoInput"><i class="fa-solid fa-circle-user"></i> লোগো আপলোড করুন (ঐচ্ছিক)</label>
                <input type="file" id="logoInput" accept="image/*" onchange="loadLogoImage(event)">
            </div>

            <button class="btn-download" onclick="downloadPhotoCard()">
                <i class="fa-solid fa-download"></i> ফটোকার্ড ডাউনলোড করুন
            </button>
        </div>

        <!-- Live Preview Section -->
        <div class="preview-panel">
            <div id="photoCard" class="photocard theme-red">
                <!-- Top Header -->
                <div class="card-header-bar">
                    <div class="brand-info">
                        <img id="cardLogo" class="brand-logo" src="https://via.placeholder.com/50/ffffff/000000?text=Logo" alt="Logo">
                        <span id="cardOrgName" class="brand-name">আল ফালাহ মানবসেবা ফাউন্ডেশন</span>
                    </div>
                    <div id="cardDate" class="card-date">১৬ সেপ্টেম্বর, ২০২৬</div>
                </div>

                <!-- Main Highlighted Image -->
                <div class="card-image-box">
                    <span id="cardCategory" class="card-category">ত্রাণ বিতরণ</span>
                    <img id="cardMainImg" src="https://via.placeholder.com/600x400/cccccc/333333?text=Main+Photo+Highlight" alt="Main Photo">
                </div>

                <!-- Bottom Headline -->
                <div class="card-headline-box">
                    <div id="cardHeadline" class="card-headline-text">
                        বন্যাদুর্গত এলাকায় আল ফালাহ মানবসেবা ফাউন্ডেশনের উদ্যোগে খাদ্য ও জরুরি ত্রাণ সামগ্রী বিতরণ করা হয়েছে।
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Update Live Card Content
        function updateCard() {
            document.getElementById('cardOrgName').innerText = document.getElementById('orgNameInput').value || 'আল ফালাহ মানবসেবা ফাউন্ডেশন';
            document.getElementById('cardCategory').innerText = document.getElementById('categoryInput').value || 'ক্যাটাগরি';
            document.getElementById('cardDate').innerText = document.getElementById('dateInput').value || 'তারিখ';
            document.getElementById('cardHeadline').innerText = document.getElementById('headlineInput').value || 'এখানে আপনার সংবাদ বা হেডলাইন থাকবে...';

            // Change Theme Template
            const card = document.getElementById('photoCard');
            const selectedTheme = document.getElementById('templateSelect').value;
            card.className = 'photocard ' + selectedTheme;
        }

        // Handle Main Image Upload
        function loadMainImage(event) {
            const output = document.getElementById('cardMainImg');
            if (event.target.files && event.target.files[0]) {
                output.src = URL.createObjectURL(event.target.files[0]);
            }
        }

        // Handle Logo Upload
        function loadLogoImage(event) {
            const output = document.getElementById('cardLogo');
            if (event.target.files && event.target.files[0]) {
                output.src = URL.createObjectURL(event.target.files[0]);
            }
        }

        // Download Photo Card as PNG
        function downloadPhotoCard() {
            const card = document.getElementById('photoCard');
            
            html2canvas(card, {
                scale: 2, // High DPI Resolution Output
                useCORS: true
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Al_Falah_Photocard.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            });
        }
    </script>
</body>
</html>
