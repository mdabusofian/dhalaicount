<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBH Member Poster Generator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* Import a clean Bengali font */
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap');

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        /* Input Panel Styling */
        .input-panel {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
        }

        .input-panel h3 {
            margin-top: 0;
            color: #d32f2f; /* App Red */
            text-align: center;
        }

        .input-panel input, .input-panel select {
            width: 95%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        /* Action Buttons */
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            flex: 1;
            transition: background 0.3s ease;
        }

        .btn-download {
            background-color: #d32f2f; /* App Red */
            color: white;
        }

        .btn-download:hover {
            background-color: #b71c1c;
        }

        /* Poster Styling - Fixed aspect ratio 4:5 for social media */
        #poster {
            width: 500px;
            height: 625px;
            background-color: #ffffff;
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Border style matches previous posters */
            border: 4px solid #1976d2; /* App Blue */
        }

        /* App Red Header with Wave */
        .poster-header {
            width: 100%;
            height: 180px;
            background-color: #d32f2f; /* App Red */
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom-left-radius: 50% 20px;
            border-bottom-right-radius: 50% 20px;
        }

        .logo-section h1 {
            color: #ffffff;
            font-size: 32px;
            margin: 0;
            font-weight: 700;
        }

        .logo-section p {
            color: #ffffff;
            font-size: 16px;
            margin: 5px 0 0;
            opacity: 0.9;
        }

        /* Floating Congrats Tag */
        .congrats-tag {
            background-color: #ffffff;
            color: #d32f2f;
            padding: 8px 25px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 20px;
            position: absolute;
            top: 155px; /* Sits on the red/white boundary */
            z-index: 3;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Photo Frame with Blue Border */
        .photo-frame {
            width: 190px;
            height: 190px;
            border: 6px solid #1976d2; /* App Blue */
            border-radius: 50%;
            margin-top: 140px; /* Position below header */
            overflow: hidden;
            background: #fff;
            z-index: 2;
            position: relative;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        #outputImg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Info Section Styling */
        .info-section {
            margin-top: 50px; /* Space from photo frame */
            text-align: center;
            width: 90%;
            z-index: 2;
        }

        .member-name {
            font-size: 30px;
            font-weight: 700;
            color: #1976d2; /* App Blue for name */
            margin-bottom: 10px;
            line-height: 1.2;
        }

        .designation-box {
            background: #d32f2f; /* App Red for designation */
            color: white;
            padding: 8px 25px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 18px;
            display: inline-block;
            margin-bottom: 15px;
        }

        .address-box {
            font-size: 16px;
            color: #555;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .address-icon {
            color: #d32f2f; /* Red location icon */
        }

        /* Footer with Contact Info */
        .poster-footer {
            width: 100%;
            position: absolute;
            bottom: 0;
            left: 0;
            background-color: #f5f5f5;
            padding: 15px 0;
            border-top: 1px solid #e0e0e0;
            text-align: center;
            font-size: 14px;
            z-index: 1;
            color: #1976d2;
        }

        .footer-url {
            font-weight: 600;
            margin-bottom: 3px;
        }

    </style>
</head>
<body>

<div class="input-panel">
    <h3>মেম্বার পোস্টার জেনারেটর</h3>
    <p style="text-align:center; color:#666; font-size:14px; margin-top:0;">তথ্য ইনপুট দিলে পোস্টারটি স্বয়ংক্রিয়ভাবে আপডেট হবে।</p>
    
    <label for="imageInput">মেম্বারের ছবি আপলোড করুন:</label>
    <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
    
    <input type="text" id="nameInput" placeholder="মেম্বারের নাম (উদা: আবু সুফিয়ান)" oninput="updateText()" maxlength="25">
    
    <select id="desigInput" onchange="updateText()">
        <option value="" disabled selected>পদবি নির্বাচন করুন</option>
        <option value="এলাকা সমন্বয়কারী">এলাকা সমন্বয়কারী</option>
        <option value="ব্লাড হিরো">ব্লাড হিরো</option>
        <option value="এলাকা প্রতিনিধি">এলাকা প্রতিনিধি</option>
        <option value="কমিউনিটি অ্যাম্বাসেডর">কমিউনিটি অ্যাম্বাসেডর</option>
    </select>
    
    <input type="text" id="addrInput" placeholder="এলাকা/ঠিকানা (উদা: কর্ণফুলী, চট্টগ্রাম)" oninput="updateText()" maxlength="35">
    
    <div class="btn-group">
        <button class="btn-download" onclick="downloadPoster()">Download Poster</button>
    </div>
</div>

<div id="poster">
    <div class="poster-header">
        <div class="logo-section">
            <h1>কর্ণফুলী ব্লাড হাব</h1>
            <p>রক্তের প্রয়োজনে আপনার পাশে</p>
        </div>
    </div>
    
    <div class="congrats-tag">অভিনন্দন!</div>

    <div class="photo-frame">
        <img id="outputImg" src="https://via.placeholder.com/190x190/eeeeee/d32f2f?text=Photo" alt="Member Photo">
    </div>

    <div class="info-section">
        <div class="member-name" id="nameText">আবু সুফিয়ান</div>
        <div class="designation-box" id="desigText">এলাকা সমন্বয়কারী</div>
        <div class="address-box">
            <span class="address-icon">📍</span>
            <span id="addrText">কর্ণফুলী, চট্টগ্রাম</span>
        </div>
    </div>

    <div class="poster-footer">
        <div class="footer-url">mdabusofian.github.io/karnaphulibloodhub/</div>
        <div class="footer-moto">চট্টগ্রামের নির্ভরযোগ্য রক্তদাতা নেটওয়ার্ক</div>
    </div>
</div>

<script>
    // 1. Image Preview Function
    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.getElementById('outputImg');
                output.src = reader.result;
            }
            reader.readAsDataURL(file);
        }
    }

    // 2. Real-time Text Update Function
    function updateText() {
        const nameInput = document.getElementById('nameInput').value;
        const desigInput = document.getElementById('desigInput').value;
        const addrInput = document.getElementById('addrInput').value;

        // Update poster elements, use placeholders if inputs are empty
        document.getElementById('nameText').innerText = nameInput || 'মেম্বারের নাম';
        document.getElementById('desigText').innerText = desigInput || 'পদবি';
        document.getElementById('addrText').innerText = addrInput || 'এলাকা, চট্টগ্রাম';

        // Adjust font size for long names to keep them on one line
        const nameTextElement = document.getElementById('nameText');
        if (nameTextElement.innerText.length > 20) {
            nameTextElement.style.fontSize = '24px';
        } else {
            nameTextElement.style.fontSize = '30px';
        }
    }

    // 3. Download Poster as Image Function
    function downloadPoster() {
        const poster = document.getElementById('poster');
        const btn = document.querySelector('.btn-download');
        
        // Change button text to indicate processing
        btn.innerText = "Processing...";
        btn.disabled = true;

        // Use html2canvas to capture the poster div
        html2canvas(poster, {
            scale: 3, // Set high scale (3x) for premium, clear image
            useCORS: true, // Allow cross-origin images (like the placeholder)
            backgroundColor: null // Transparent background around rounded corners
        }).then(canvas => {
            // Create a temporary link element to trigger download
            const link = document.createElement('a');
            
            // Generate filename based on member name
            const memberName = document.getElementById('nameText').innerText.trim().replace(/\s+/g, '_');
            link.download = `KBH_Member_${memberName}.png`;
            
            // Convert canvas to base64 PNG data
            link.href = canvas.toDataURL("image/png", 1.0);
            
            // Trigger the download
            link.click();
            
            // Restore button state
            btn.innerText = "Download Poster";
            btn.disabled = false;
        }).catch(err => {
            console.error("Error generating image:", err);
            alert("দুঃখিত, পোস্টারটি তৈরি করা যায়নি। আবার চেষ্টা করুন।");
            btn.innerText = "Download Poster";
            btn.disabled = false;
        });
    }
    
    // Initial call to set placeholder texts
    updateText();
</script>

</body>
            </html>
