<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBH Ultimate Premium Card Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --premium-red: #8e0e00;
            --premium-red-light: #b71c1c;
            --premium-gold: #d4af37;
            --premium-gold-dark: #b8962e;
            --premium-dark-bg: #111111;
            --premium-dark-gradient: linear-gradient(135deg, #1f1c18 0%, #111111 100%);
            --text-white: #ffffff;
            --text-gold: #d4af37;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #1a1a1a; /* Dark background for browser */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            margin: 0;
            color: #eee;
        }

        /* Input Panel Styling (Will not be part of the final image) */
        .input-panel {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            margin-bottom: 40px;
            width: 100%;
            max-width: 480px;
            box-sizing: border-box;
            border: 1px solid rgba(212, 175, 55, 0.2);
        }

        .input-panel h2 {
            margin-top: 0;
            color: var(--premium-gold);
            text-align: center;
            font-size: 26px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: rgba(255,255,255,0.7);
        }

        .input-panel input, .input-panel select {
            width: 100%;
            padding: 13px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', sans-serif;
            font-size: 15px;
            background-color: #1a1a1a;
            color: #eee;
        }

        button.btn-download {
            width: 100%;
            background: linear-gradient(135deg, var(--premium-gold), var(--premium-gold-dark));
            color: var(--premium-dark-bg);
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 19px;
            transition: transform 0.2s, box-shadow 0.3s;
            font-family: 'Hind Siliguri', sans-serif;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button.btn-download:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.5);
        }

        button.btn-download:disabled {
            background: #555;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Poster/Card Container - Ultimate Premium Design */
        /* 4:5 Aspect Ratio (1080x1350px for high res) */
        #ultimate-card-container {
            width: 500px;
            height: 625px;
            background: var(--premium-dark-gradient); /* Ultimate Dark Gradient Background */
            position: relative;
            overflow: hidden;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Premium double border effect */
            border: 4px solid var(--premium-gold);
            box-sizing: border-box;
        }

        /* Top Gilded Arch */
        #ultimate-card-container::before {
            content: '';
            position: absolute;
            top: -50px;
            left: -50px;
            width: 600px;
            height: 250px;
            background: conic-gradient(var(--premium-red), var(--premium-red-light), var(--premium-red));
            border-radius: 50%;
            z-index: 1;
            filter: blur(1px);
            opacity: 0.9;
            border-bottom: 5px solid var(--premium-gold);
        }

        /* Glossy Highlight Overlay */
        #ultimate-card-container::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 40%, rgba(255,255,255,0.05) 100%);
            z-index: 5;
            pointer-events: none;
        }

        /* Header Styling */
        .poster-header {
            width: 100%;
            height: 140px;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .header-logo-text {
            color: var(--text-white);
            font-size: 38px;
            margin: 0;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            -webkit-background-clip: text;
            background-image: linear-gradient(135deg, var(--text-white), #cccccc);
        }

        .header-slogan {
            color: var(--text-gold);
            font-size: 17px;
            margin: 5px 0 0;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Photo Frame - Premium Pentagonal with Gold & Red */
        .photo-frame-container {
            width: 210px;
            height: 210px;
            position: absolute;
            top: 100px; /* Sits over boundary */
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo-frame-outer {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(var(--premium-gold), var(--premium-red-light), var(--premium-gold));
            padding: 8px; /* Thickness */
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            box-sizing: border-box;
            position: relative;
        }
        
        /* Gilded border effect inside frame */
        .photo-frame-outer::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.3);
            z-index: 1;
        }

        .photo-frame-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: var(--premium-dark-bg);
            overflow: hidden;
            border: 3px solid var(--premium-dark-bg);
            box-sizing: border-box;
            z-index: 2;
            position: relative;
        }

        #outputImg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Info Section */
        .info-section {
            width: 90%;
            position: absolute;
            top: 330px;
            z-index: 3;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .congrats-text {
            color: var(--premium-gold);
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 1px 1px 3px rgba(212, 175, 55, 0.3);
        }

        .member-name {
            font-size: 36px;
            font-weight: 700;
            color: var(--text-white);
            margin: 0 0 12px;
            line-height: 1.2;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        .designation-badge {
            background: linear-gradient(135deg, var(--premium-red-light), var(--premium-red));
            color: var(--text-white);
            padding: 10px 35px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 19px;
            display: inline-block;
            margin-bottom: 18px;
            box-shadow: 0 6px 15px rgba(183, 28, 28, 0.4);
            border: 2px solid rgba(255,255,255,0.2);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .address-box {
            font-size: 17px;
            color: rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .address-icon {
            color: var(--premium-gold);
            font-size: 19px;
        }

        /* Footer with QR Code & Link */
        .poster-footer {
            width: 100%;
            height: 110px;
            position: absolute;
            bottom: 0;
            left: 0;
            background-color: rgba(0,0,0,0.7);
            border-top: 3px solid var(--premium-gold);
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            box-sizing: border-box;
        }

        .footer-left {
            display: flex;
            flex-direction: column;
            color: var(--text-white);
        }

        .footer-url {
            font-size: 19px;
            font-weight: 700;
            color: var(--premium-gold);
            margin-bottom: 4px;
            text-transform: lowercase;
            letter-spacing: 0.5px;
        }

        .footer-moto {
            font-size: 15px;
            color: rgba(255,255,255,0.7);
            font-weight: 400;
        }

        .footer-right {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* QR Code Container */
        #qrcode-container {
            width: 75px;
            height: 75px;
            background-color: var(--text-white);
            padding: 6px;
            border-radius: 10px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
            border: 3px solid var(--premium-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        
        #qrcode img {
            width: 100%;
            height: 100%;
        }

    </style>
</head>
<body>

<div class="input-panel">
    <h2>KBH Ultimate Card</h2>
    
    <div class="form-group">
        <label for="imageInput">১. মেম্বারের ছবি আপলোড করুন:</label>
        <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
    </div>
    
    <div class="form-group">
        <label for="nameInput">২. মেম্বারের নাম:</label>
        <input type="text" id="nameInput" placeholder="উদা: আবু সুফিয়ান" oninput="updatePoster()" maxlength="25">
    </div>
    
    <div class="form-group">
        <label for="desigInput">৩. পদবি নির্বাচন করুন:</label>
        <select id="desigInput" onchange="updatePoster()">
            <option value="" disabled selected>নির্বাচন করুন</option>
            <option value="এলাকা সমন্বয়কারী">এলাকা সমন্বয়কারী</option>
            <option value="ব্লাড হিরো">ব্লাড হিরো</option>
            <option value="এলাকা প্রতিনিধি">এলাকা প্রতিনিধি</option>
            <option value="কমিউনিটি অ্যাম্বাসেডর">কমিউনিটি অ্যাম্বাসেডর</option>
            <option value="ফাউন্ডার এডমিন">ফাউন্ডার এডমিন</option>
            <option value="স্বেচ্ছাসেবী">স্বেচ্ছাসেবী</option>
        </select>
    </div>
    
    <div class="form-group">
        <label for="addrInput">৪. এলাকা/ঠিকানা:</label>
        <input type="text" id="addrInput" placeholder="উদা: কর্ণফুলী, চট্টগ্রাম" oninput="updatePoster()" maxlength="35">
    </div>
    
    <button class="btn-download" id="downloadBtn" onclick="downloadUltimateCard()">Download Ultimate Card</button>
</div>

<div id="ultimate-card-container">
    
    <div class="poster-header">
        <h1 class="header-logo-text">কর্ণফুলী ব্লাড হাব</h1>
        <p class="header-slogan">Reliable Blood Donor Network</p>
    </div>
    
    <div class="photo-frame-container">
        <div class="photo-frame-outer">
            <div class="photo-frame-inner">
                <img id="outputImg" src="https://via.placeholder.com/210x210/111111/d4af37?text=KBH" alt="Member Photo">
            </div>
        </div>
    </div>

    <div class="info-section">
        <div class="congrats-text">অভিনন্দন!</div>
        <h2 class="member-name" id="nameText">মেম্বারের নাম</h2>
        <div class="designation-badge" id="desigText">পদবি</div>
        <div class="address-box">
            <span class="address-icon">📍</span>
            <span id="addrText">এলাকা, চট্টগ্রাম</span>
        </div>
    </div>

    <div class="poster-footer">
        <div class="footer-left">
            <div class="footer-url">karnaphulibloodhub.com</div>
            <div class="footer-moto">রক্তের প্রয়োজনে আপনার পাশে</div>
        </div>
        <div class="footer-right">
            <div id="qrcode-container">
                <div id="qrcode"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // Constants
    const WEBSITE_URL = "https://mdabusofian.github.io/karnaphulibloodhub/";

    // Initialize QR Code
    const qrcode = new QRCode(document.getElementById("qrcode"), {
        text: WEBSITE_URL,
        width: 63,
        height: 63,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
    });

    // 1. Image Preview Function
    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.getElementById('outputImg');
                output.src = reader.result;
            }
            reader.readAsDataURL(file);
        }
    }

    // 2. Real-time Poster Update Function
    function updatePoster() {
        const nameInput = document.getElementById('nameInput').value;
        const desigInput = document.getElementById('desigInput').value;
        const addrInput = document.getElementById('addrInput').value;

        // Update elements, use placeholders if inputs are empty
        document.getElementById('nameText').innerText = nameInput || 'আবু সুফিয়ান';
        document.getElementById('desigText').innerText = desigInput || 'এলাকা সমন্বয়কারী';
        document.getElementById('addrText').innerText = addrInput || 'কর্ণফুলী, চট্টগ্রাম';

        // Dynamic Font Size for long names
        const nameElement = document.getElementById('nameText');
        if (nameElement.innerText.length > 20) {
            nameElement.style.fontSize = '28px';
        } else if (nameElement.innerText.length > 15) {
            nameElement.style.fontSize = '32px';
        } else {
            nameElement.style.fontSize = '36px';
        }
    }

    // 3. Download Poster as High-Res Image
    function downloadUltimateCard() {
        const container = document.getElementById('ultimate-card-container');
        const btn = document.getElementById('downloadBtn');
        const memberName = document.getElementById('nameText').innerText.trim().replace(/\s+/g, '_');

        // Indicate processing
        btn.innerText = "Generating Ultra High-Res Image...";
        btn.disabled = true;

        // Use html2canvas to capture
        html2canvas(container, {
            scale: 5, // 5x scale for extremely crisp, print-ready premium quality
            useCORS: true, // Allow cross-origin images
            backgroundColor: "#111111", // Dark canvas background
            logging: false,
            onclone: function(clonedDoc) {
                // Ensure QR code is rendered
                clonedDoc.getElementById('qrcode').style.display = 'block';
            }
        }).then(canvas => {
            // Create download link
            const link = document.createElement('a');
            link.download = `KBH_Ultimate_Card_${memberName}.png`;
            link.href = canvas.toDataURL("image/png", 1.0);
            
            // Trigger download
            link.click();
            
            // Restore button
            btn.innerText = "Download Ultimate Card";
            btn.disabled = false;
        }).catch(err => {
            console.error("Error generating image:", err);
            alert("দুঃখিত, কার্ডটি তৈরি করা যায়নি। আবার চেষ্টা করুন।");
            btn.innerText = "Download Ultimate Card";
            btn.disabled = false;
        });
    }
    
    // Initial update to set placeholder texts
    updatePoster();
</script>

</body>
</html>
