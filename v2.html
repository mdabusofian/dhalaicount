<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBH Premium Representative Card Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --app-red: #d32f2f;
            --app-blue: #1976d2;
            --premium-gold: #d4af37;
            --premium-dark: #1a1a1a;
            --text-white: #ffffff;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            color: #333;
        }

        /* Input Panel Styling (Will not be part of the final image) */
        .input-panel {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
        }

        .input-panel h2 {
            margin-top: 0;
            color: var(--app-red);
            text-align: center;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }

        .input-panel input, .input-panel select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', sans-serif;
            font-size: 15px;
        }

        button.btn-download {
            width: 100%;
            background: linear-gradient(135deg, var(--premium-gold), #b8962e);
            color: var(--premium-dark);
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Hind Siliguri', sans-serif;
            margin-top: 10px;
        }

        button.btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        button.btn-download:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Poster/Card Styling - 4:5 Aspect Ratio (1080x1350px for high res) */
        #poster-container {
            width: 500px;
            height: 625px;
            background-color: var(--premium-dark);
            position: relative;
            overflow: hidden;
            border-radius: 20px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Thin premium gold border */
            border: 3px solid var(--premium-gold);
            box-sizing: border-box;
        }

        /* Premium Gold Gradient Overlay */
        #poster-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.1) 0%, rgba(0,0,0,0) 50%, rgba(212, 175, 55, 0.05) 100%);
            z-index: 1;
        }

        /* Header Styling */
        .poster-header {
            width: 100%;
            height: 150px;
            background: linear-gradient(135deg, var(--app-red), #b71c1c);
            position: absolute;
            top: 0;
            left: 0;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-bottom: 4px solid var(--premium-gold);
        }

        .header-logo-text {
            color: var(--text-white);
            font-size: 36px;
            margin: 0;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header-slogan {
            color: rgba(255,255,255,0.9);
            font-size: 16px;
            margin: 5px 0 0;
            font-weight: 400;
        }

        /* Photo Frame - Premium Circular with Gold & Blue */
        .photo-frame-container {
            width: 200px;
            height: 200px;
            position: absolute;
            top: 110px; /* Sits over the header boundary */
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo-frame-outer {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(var(--premium-gold), var(--app-blue), var(--premium-gold));
            padding: 8px; /* Thickness of the outer frame */
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            box-sizing: border-box;
        }

        .photo-frame-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: var(--text-white);
            overflow: hidden;
            border: 2px solid var(--premium-dark);
            box-sizing: border-box;
        }

        #outputImg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Info Section */
        .info-section {
            width: 90%;
            position: absolute;
            top: 330px;
            z-index: 3;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .congrats-text {
            color: var(--premium-gold);
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .member-name {
            font-size: 34px;
            font-weight: 700;
            color: var(--text-white);
            margin: 0 0 10px;
            line-height: 1.2;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        .designation-badge {
            background: linear-gradient(135deg, var(--app-blue), #1565c0);
            color: var(--text-white);
            padding: 8px 30px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 18px;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(25, 118, 210, 0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .address-box {
            font-size: 16px;
            color: rgba(255,255,255,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .address-icon {
            color: var(--app-red);
            font-size: 18px;
        }

        /* Footer with QR Code & Link */
        .poster-footer {
            width: 100%;
            height: 100px;
            position: absolute;
            bottom: 0;
            left: 0;
            background-color: rgba(0,0,0,0.5);
            border-top: 2px solid var(--premium-gold);
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
        }

        .footer-left {
            display: flex;
            flex-direction: column;
            color: var(--text-white);
        }

        .footer-url {
            font-size: 18px;
            font-weight: 700;
            color: var(--premium-gold);
            margin-bottom: 3px;
        }

        .footer-moto {
            font-size: 14px;
            color: rgba(255,255,255,0.7);
        }

        .footer-right {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* QR Code Container */
        #qrcode-container {
            width: 70px;
            height: 70px;
            background-color: var(--text-white);
            padding: 5px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 2px solid var(--premium-gold);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #qrcode img {
            width: 100%;
            height: 100%;
        }

    </style>
</head>
<body>

<div class="input-panel">
    <h2>প্রিমিয়াম কার্ড জেনারেটর</h2>
    
    <div class="form-group">
        <label for="imageInput">১. মেম্বারের ছবি আপলোড করুন:</label>
        <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
    </div>
    
    <div class="form-group">
        <label for="nameInput">২. মেম্বারের নাম:</label>
        <input type="text" id="nameInput" placeholder="উদা: আবু সুফিয়ান" oninput="updatePoster()" maxlength="25">
    </div>
    
    <div class="form-group">
        <label for="desigInput">৩. পদবি নির্বাচন করুন:</label>
        <select id="desigInput" onchange="updatePoster()">
            <option value="" disabled selected>নির্বাচন করুন</option>
            <option value="এলাকা সমন্বয়কারী">এলাকা সমন্বয়কারী</option>
            <option value="ব্লাড হিরো">ব্লাড হিরো</option>
            <option value="এলাকা প্রতিনিধি">এলাকা প্রতিনিধি</option>
            <option value="কমিউনিটি অ্যাম্বাসেডর">কমিউনিটি অ্যাম্বাসেডর</option>
            <option value="ফাউন্ডার এডমিন">ফাউন্ডার এডমিন</option>
        </select>
    </div>
    
    <div class="form-group">
        <label for="addrInput">৪. এলাকা/ঠিকানা:</label>
        <input type="text" id="addrInput" placeholder="উদা: কর্ণফুলী, চট্টগ্রাম" oninput="updatePoster()" maxlength="35">
    </div>
    
    <button class="btn-download" id="downloadBtn" onclick="downloadPremiumCard()">Download Premium Card</button>
</div>

<div id="poster-container">
    
    <div class="poster-header">
        <h1 class="header-logo-text">কর্ণফুলী ব্লাড হাব</h1>
        <p class="header-slogan">চট্টগ্রামের নির্ভরযোগ্য রক্তদাতা নেটওয়ার্ক</p>
    </div>
    
    <div class="photo-frame-container">
        <div class="photo-frame-outer">
            <div class="photo-frame-inner">
                <img id="outputImg" src="https://via.placeholder.com/200x200/333333/d4af37?text=KBH" alt="Member Photo">
            </div>
        </div>
    </div>

    <div class="info-section">
        <div class="congrats-text">অভিনন্দন!</div>
        <h2 class="member-name" id="nameText">মেম্বারের নাম</h2>
        <div class="designation-badge" id="desigText">পদবি</div>
        <div class="address-box">
            <span class="address-icon">📍</span>
            <span id="addrText">এলাকা, চট্টগ্রাম</span>
        </div>
    </div>

    <div class="poster-footer">
        <div class="footer-left">
            <div class="footer-url">karnaphulibloodhub.com</div>
            <div class="footer-moto">রক্তের প্রয়োজনে আপনার পাশে</div>
        </div>
        <div class="footer-right">
            <div id="qrcode-container">
                <div id="qrcode"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // Constants
    const WEBSITE_URL = "https://mdabusofian.github.io/karnaphulibloodhub/";

    // Initialize QR Code
    const qrcode = new QRCode(document.getElementById("qrcode"), {
        text: WEBSITE_URL,
        width: 60,
        height: 60,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
    });

    // 1. Image Preview Function
    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.getElementById('outputImg');
                output.src = reader.result;
            }
            reader.readAsDataURL(file);
        }
    }

    // 2. Real-time Poster Update Function
    function updatePoster() {
        const nameInput = document.getElementById('nameInput').value;
        const desigInput = document.getElementById('desigInput').value;
        const addrInput = document.getElementById('addrInput').value;

        // Update elements, use placeholders if inputs are empty
        document.getElementById('nameText').innerText = nameInput || 'আবু সুফিয়ান';
        document.getElementById('desigText').innerText = desigInput || 'এলাকা সমন্বয়কারী';
        document.getElementById('addrText').innerText = addrInput || 'কর্ণফুলী, চট্টগ্রাম';

        // Dynamic Font Size for long names
        const nameElement = document.getElementById('nameText');
        if (nameElement.innerText.length > 20) {
            nameElement.style.fontSize = '26px';
        } else if (nameElement.innerText.length > 15) {
            nameElement.style.fontSize = '30px';
        } else {
            nameElement.style.fontSize = '34px';
        }
    }

    // 3. Download Poster as High-Res Image
    function downloadPremiumCard() {
        const container = document.getElementById('poster-container');
        const btn = document.getElementById('downloadBtn');
        const memberName = document.getElementById('nameText').innerText.trim().replace(/\s+/g, '_');

        // Indicate processing
        btn.innerText = "Generating High-Res Image...";
        btn.disabled = true;

        // Use html2canvas to capture
        html2canvas(container, {
            scale: 4, // 4x scale for super crisp, premium print quality
            useCORS: true, // Allow cross-origin images
            backgroundColor: "#1a1a1a", // Set canvas background same as premium dark
            logging: false,
            onclone: function(clonedDoc) {
                // Ensure QR code is fully rendered in the clone
                clonedDoc.getElementById('qrcode').style.display = 'block';
            }
        }).then(canvas => {
            // Create download link
            const link = document.createElement('a');
            link.download = `KBH_Premium_Card_${memberName}.png`;
            link.href = canvas.toDataURL("image/png", 1.0);
            
            // Trigger download
            link.click();
            
            // Restore button
            btn.innerText = "Download Premium Card";
            btn.disabled = false;
        }).catch(err => {
            console.error("Error generating image:", err);
            alert("দুঃখিত, কার্ডটি তৈরি করা যায়নি। আবার চেষ্টা করুন।");
            btn.innerText = "Download Premium Card";
            btn.disabled = false;
        });
    }
    
    // Initial update to set placeholder texts
    updatePoster();
</script>

</body>
</html>
