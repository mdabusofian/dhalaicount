<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KBH Light Professional Representative Card Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --kbh-red: #e31b23; /* Vibrant Blood Red */
            --kbh-red-dark: #b71c1c;
            --kbh-red-light: #ffcdd2;
            --bg-light: #ffffff;
            --bg-subtle: #f8f9fa;
            --text-main: #212121;
            --text-subtle: #616161;
            --text-white: #ffffff;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: #e0e0e0; /* Neutral background for browser */
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
            color: var(--text-main);
        }

        /* Input Panel Styling (Will not be part of the final image) */
        .input-panel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            width: 100%;
            max-width: 450px;
            box-sizing: border-box;
            border-top: 4px solid var(--kbh-red);
        }

        .input-panel h2 {
            margin-top: 0;
            color: var(--kbh-red);
            text-align: center;
            font-size: 24px;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: var(--text-main);
        }

        .input-panel input, .input-panel select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: 'Hind Siliguri', sans-serif;
            font-size: 15px;
            background-color: white;
        }

        button.btn-download {
            width: 100%;
            background-color: var(--kbh-red);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            font-size: 17px;
            transition: background 0.3s ease, transform 0.2s;
            font-family: 'Hind Siliguri', sans-serif;
            margin-top: 10px;
        }

        button.btn-download:hover {
            background-color: var(--kbh-red-dark);
            transform: translateY(-2px);
        }

        button.btn-download:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        /* Poster/Card Container - Light & Professional Design */
        /* 4:5 Aspect Ratio (1080x1350px for high res) */
        #light-card-container {
            width: 500px;
            height: 625px;
            background-color: var(--bg-light); /* Complete Light Background */
            position: relative;
            overflow: hidden;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Vibrant red border only on top */
            border-top: 10px solid var(--kbh-red);
            box-sizing: border-box;
        }

        /* Red Blood Drop Graphic Elements */
        #light-card-container::before {
            content: '';
            position: absolute;
            top: 20px;
            right: 20px;
            width: 100px;
            height: 100px;
            background-color: rgba(227, 27, 35, 0.05); /* Subtle red drop */
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            z-index: 1;
        }

        /* Header Styling */
        .poster-header {
            width: 90%;
            margin-top: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
            position: relative;
        }
        
        /* New Logo Symbol: stylized 'K' with blood drop */
        .logo-symbol {
            font-size: 40px;
            font-weight: 700;
            color: var(--kbh-red);
            margin-right: 15px;
            position: relative;
        }
        
        .logo-symbol::after {
            content: '🩸';
            font-size: 25px;
            position: absolute;
            top: -10px;
            right: -15px;
        }

        .header-logo-text {
            color: var(--kbh-red);
            font-size: 34px;
            margin: 0;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* Photo Frame - Clean with Red Outline */
        .photo-frame-container {
            width: 190px;
            height: 190px;
            position: absolute;
            top: 110px; /* Sits below header */
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo-frame-outer {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: var(--bg-light);
            padding: 5px; /* Thickness */
            box-shadow: 0 6px 20px rgba(227, 27, 35, 0.2);
            box-sizing: border-box;
            border: 3px solid var(--kbh-red); /* Main Red Border */
            position: relative;
        }

        .photo-frame-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            box-sizing: border-box;
            background-color: var(--bg-subtle);
        }

        #outputImg {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Info Section */
        .info-section {
            width: 90%;
            position: absolute;
            top: 320px;
            z-index: 3;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .congrats-text {
            color: var(--text-main);
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .member-name {
            font-size: 36px;
            font-weight: 700;
            color: var(--kbh-red); /* Name in Red */
            margin: 0 0 10px;
            line-height: 1.2;
        }

        .designation-badge {
            background-color: var(--text-main); /* Designation in Black */
            color: var(--text-white);
            padding: 8px 30px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 17px;
            display: inline-block;
            margin-bottom: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .address-box {
            font-size: 16px;
            color: var(--text-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .address-icon {
            color: var(--kbh-red);
            font-size: 18px;
        }

        /* Footer with QR Code & Link - Separated Red Line */
        .poster-footer {
            width: 100%;
            height: 120px;
            position: absolute;
            bottom: 0;
            left: 0;
            background-color: var(--bg-subtle);
            border-top: 2px solid #eeeeee;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            box-sizing: border-box;
        }

        .footer-left {
            display: flex;
            flex-direction: column;
            color: var(--text-main);
        }

        .footer-url {
            font-size: 18px;
            font-weight: 700;
            color: var(--kbh-red); /* Link in Red */
            margin-bottom: 4px;
            text-transform: lowercase;
        }

        .footer-moto {
            font-size: 14px;
            color: var(--text-subtle);
            font-weight: 400;
        }

        .footer-right {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* QR Code Container - Clean Red Border */
        #qrcode-container {
            width: 80px;
            height: 80px;
            background-color: var(--bg-light);
            padding: 6px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 2px solid var(--kbh-red);
            display: flex;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
        }
        
        #qrcode img {
            width: 100%;
            height: 100%;
        }

    </style>
</head>
<body>

<div class="input-panel">
    <h2>KBH মেম্বার কার্ড</h2>
    <p style="text-align:center; color:#666; font-size:14px; margin-top:-10px; margin-bottom:20px;">লাইট থিম ডিজাইন</p>
    
    <div class="form-group">
        <label for="imageInput">১. মেম্বারের ছবি আপলোড করুন:</label>
        <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
    </div>
    
    <div class="form-group">
        <label for="nameInput">২. মেম্বারের নাম:</label>
        <input type="text" id="nameInput" placeholder="উদা: আবু সুফিয়ান" oninput="updatePoster()" maxlength="25">
    </div>
    
    <div class="form-group">
        <label for="desigInput">৩. পদবি নির্বাচন করুন:</label>
        <select id="desigInput" onchange="updatePoster()">
            <option value="" disabled selected>নির্বাচন করুন</option>
            <option value="এলাকা সমন্বয়কারী">এলাকা সমন্বয়কারী</option>
            <option value="ব্লাড হিরো">ব্লাড হিরো</option>
            <option value="এলাকা প্রতিনিধি">এলাকা প্রতিনিধি</option>
            <option value="কমিউনিটি অ্যাম্বাসেডর">কমিউনিটি অ্যাম্বাসেডর</option>
            <option value="স্বেচ্ছাসেবী">স্বেচ্ছাসেবী</option>
        </select>
    </div>
    
    <div class="form-group">
        <label for="addrInput">৪. এলাকা/ঠিকানা:</label>
        <input type="text" id="addrInput" placeholder="উদা: কর্ণফুলী, চট্টগ্রাম" oninput="updatePoster()" maxlength="35">
    </div>
    
    <button class="btn-download" id="downloadBtn" onclick="downloadLightCard()">Download High-Res Card</button>
</div>

<div id="light-card-container">
    
    <div class="poster-header">
        <div class="logo-symbol">K</div>
        <h1 class="header-logo-text">কর্ণফুলী ব্লাড হাব</h1>
    </div>
    
    <div class="photo-frame-container">
        <div class="photo-frame-outer">
            <div class="photo-frame-inner">
                <img id="outputImg" src="https://via.placeholder.com/190x190/eeeeee/e31b23?text=Photo" alt="Member Photo">
            </div>
        </div>
    </div>

    <div class="info-section">
        <div class="congrats-text">অভিনন্দন! আপনি এখন আমাদের</div>
        <h2 class="member-name" id="nameText">মেম্বারের নাম</h2>
        <div class="designation-badge" id="desigText">পদবি</div>
        <div class="address-box">
            <span class="address-icon">📍</span>
            <span id="addrText">এলাকা, চট্টগ্রাম</span>
        </div>
    </div>

    <div class="poster-footer">
        <div class="footer-left">
            <div class="footer-url">karnaphulibloodhub.com</div>
            <div class="footer-moto">চট্টগ্রামের নির্ভরযোগ্য রক্তদাতা নেটওয়ার্ক</div>
        </div>
        <div class="footer-right">
            <div id="qrcode-container">
                <div id="qrcode"></div>
            </div>
        </div>
    </div>
</div>

<script>
    // Constants
    const WEBSITE_URL = "https://mdabusofian.github.io/karnaphulibloodhub/";

    // Initialize QR Code
    const qrcode = new QRCode(document.getElementById("qrcode"), {
        text: WEBSITE_URL,
        width: 66,
        height: 66,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
    });

    // 1. Image Preview Function
    function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function() {
                const output = document.getElementById('outputImg');
                output.src = reader.result;
            }
            reader.readAsDataURL(file);
        }
    }

    // 2. Real-time Poster Update Function
    function updatePoster() {
        const nameInput = document.getElementById('nameInput').value;
        const desigInput = document.getElementById('desigInput').value;
        const addrInput = document.getElementById('addrInput').value;

        // Update elements, use placeholders if inputs are empty
        document.getElementById('nameText').innerText = nameInput || 'আবু সুফিয়ান';
        document.getElementById('desigText').innerText = desigInput || 'এলাকা সমন্বয়কারী';
        document.getElementById('addrText').innerText = addrInput || 'কর্ণফুলী, চট্টগ্রাম';

        // Dynamic Font Size for long names
        const nameElement = document.getElementById('nameText');
        if (nameElement.innerText.length > 20) {
            nameElement.style.fontSize = '26px';
        } else if (nameElement.innerText.length > 15) {
            nameElement.style.fontSize = '30px';
        } else {
            nameElement.style.fontSize = '36px';
        }
    }

    // 3. Download Poster as High-Res Image
    function downloadLightCard() {
        const container = document.getElementById('light-card-container');
        const btn = document.getElementById('downloadBtn');
        const memberName = document.getElementById('nameText').innerText.trim().replace(/\s+/g, '_');

        // Indicate processing
        btn.innerText = "Generating High-Res Image...";
        btn.disabled = true;

        // Use html2canvas to capture
        html2canvas(container, {
            scale: 4, // 4x scale for super crisp, premium print quality
            useCORS: true, // Allow cross-origin images
            backgroundColor: "#ffffff", // Pure white background
            logging: false,
            onclone: function(clonedDoc) {
                // Ensure QR code is rendered
                clonedDoc.getElementById('qrcode').style.display = 'block';
            }
        }).then(canvas => {
            // Create download link
            const link = document.createElement('a');
            link.download = `KBH_Light_Card_${memberName}.png`;
            link.href = canvas.toDataURL("image/png", 1.0);
            
            // Trigger download
            link.click();
            
            // Restore button
            btn.innerText = "Download High-Res Card";
            btn.disabled = false;
        }).catch(err => {
            console.error("Error generating image:", err);
            alert("দুঃখিত, কার্ডটি তৈরি করা যায়নি। আবার চেষ্টা করুন।");
            btn.innerText = "Download High-Res Card";
            btn.disabled = false;
        });
    }
    
    // Initial update to set placeholder texts
    updatePoster();
</script>

</body>
</html>
