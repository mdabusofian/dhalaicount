<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>রমজান ২০২৬ - চট্টগ্রাম</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Hind Siliguri', sans-serif; background: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .hero-gradient { background: linear-gradient(135deg, #065f46 0%, #047857 100%); }
        .active-day { border: 2px solid #10b981; background: #ecfdf5 !important; transform: scale(1.02); }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; }
        
        /* ডেক্সটপে টেবিল দেখাবে, মোবাইলে হাইড হবে */
        @media (max-width: 768px) {
            .desktop-table { display: none; }
            .mobile-cards { display: block; }
        }
        @media (min-width: 769px) {
            .desktop-table { display: block; }
            .mobile-cards { display: none; }
        }
    </style>
</head>
<body class="pb-24">

    <div class="hero-gradient text-white p-6 pb-20 rounded-b-[3rem] shadow-xl text-center relative">
        <h1 class="text-3xl font-bold mb-1">🌙 রমজান ২০২৬</h1>
        <p class="opacity-90 text-sm">চট্টগ্রাম জেলা | ইসলামিক ফাউন্ডেশন</p>
        
        <div class="mt-4 inline-flex items-center gap-2 bg-black/20 px-4 py-1 rounded-full text-lg">
            <span id="live-clock">০০:০০:০০</span>
        </div>
    </div>

    <div class="max-w-md mx-auto -mt-12 px-4 relative z-10">
        <div class="glass rounded-3xl shadow-2xl p-6 border border-emerald-100">
            <div class="flex justify-between items-center mb-4">
                <span class="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full text-xs font-bold">আজকের সময়সূচী</span>
                <span id="top-date" class="text-gray-500 text-sm">--</span>
            </div>
            
            <div class="grid grid-cols-2 gap-4 text-center">
                <div class="bg-red-50 p-4 rounded-2xl border border-red-100">
                    <p class="text-gray-500 text-xs">সাহরী শেষ</p>
                    <p id="top-sehri" class="text-2xl font-bold text-red-600">--</p>
                </div>
                <div class="bg-emerald-50 p-4 rounded-2xl border border-emerald-100">
                    <p class="text-gray-500 text-xs">ইফতার</p>
                    <p id="top-iftar" class="text-2xl font-bold text-emerald-600">--</p>
                </div>
            </div>
            
            <div class="mt-4 text-center p-2 bg-slate-50 rounded-xl">
                <p class="text-xs text-gray-400 uppercase tracking-widest">ইফতার পর্যন্ত বাকি</p>
                <p id="countdown" class="text-xl font-mono font-bold text-slate-700">--:--:--</p>
            </div>
        </div>
    </div>

    <div class="max-w-5xl mx-auto mt-8 px-4">
        
        <div class="desktop-table bg-white rounded-2xl shadow-sm overflow-hidden border border-gray-100">
            <table class="w-full text-center">
                <thead class="bg-emerald-800 text-white">
                    <tr>
                        <th class="p-4">রমজান</th>
                        <th class="p-4">তারিখ</th>
                        <th class="p-4">বার</th>
                        <th class="p-4">সাহরী</th>
                        <th class="p-4">ইফতার</th>
                    </tr>
                </thead>
                <tbody id="pc-body"></tbody>
            </table>
        </div>

        <div class="mobile-cards space-y-3" id="mobile-list">
            </div>

    </div>

    <div class="bottom-nav glass border-t border-gray-200 p-3 md:hidden">
        <div class="flex justify-around items-center max-w-sm mx-auto">
            <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="flex flex-col items-center text-emerald-600">
                <span class="text-xl">🏠</span>
                <span class="text-[10px]">হোম</span>
            </button>
            <button onclick="scrollToToday()" class="flex flex-col items-center bg-emerald-600 text-white p-2 rounded-2xl shadow-lg -mt-8 border-4 border-white">
                <span class="text-xl">🎯</span>
                <span class="text-[10px] font-bold">আজকে</span>
            </button>
            <button onclick="toggleNotification()" id="notif-icon" class="flex flex-col items-center text-gray-500">
                <span class="text-xl">🔔</span>
                <span class="text-[10px]">এলার্ট</span>
            </button>
        </div>
    </div>

    <script>
        const ramadanData = [
            { no: "০১", date: "১৯ ফেব্রুয়ারি", day: "বৃহস্পতিবার", sehri: "৫:০৫", iftar: "৫:৫৩" },
            { no: "০২", date: "২০ ফেব্রুয়ারি", day: "শুক্রবার", sehri: "৫:০৪", iftar: "৫:৫৪" },
            { no: "০৩", date: "২১ ফেব্রুয়ারি", day: "শনিবার", sehri: "৫:০৩", iftar: "৫:৫৪" },
            { no: "০৪", date: "২২ ফেব্রুয়ারি", day: "রবিবার", sehri: "৫:০৩", iftar: "৫:৫৫" },
            { no: "০৫", date: "২৩ ফেব্রুয়ারি", day: "সোমবার", sehri: "৫:০২", iftar: "৫:৫৫" },
            { no: "০৬", date: "২৪ ফেব্রুয়ারি", day: "মঙ্গলবার", sehri: "৫:০১", iftar: "৫:৫৬" },
            { no: "০৭", date: "২৫ ফেব্রুয়ারি", day: "বুধবার", sehri: "৫:০১", iftar: "৫:৫৬" },
            { no: "০৮", date: "২৬ ফেব্রুয়ারি", day: "বৃহস্পতিবার", sehri: "৫:০০", iftar: "৫:৫৭" },
            { no: "০৯", date: "২৭ ফেব্রুয়ারি", day: "শুক্রবার", sehri: "৪:৫৯", iftar: "৫:৫৭" },
            { no: "১০", date: "২৮ ফেব্রুয়ারি", day: "শনিবার", sehri: "৪:৫৮", iftar: "৫:৫৮" },
            { no: "১১", date: "০১ মার্চ", day: "রবিবার", sehri: "৪:৫৮", iftar: "৫:৫৮" },
            { no: "১২", date: "০২ মার্চ", day: "সোমবার", sehri: "৪:৫৭", iftar: "৫:৫৯" },
            { no: "১৩", date: "০৩ মার্চ", day: "মঙ্গলবার", sehri: "৪:৫৬", iftar: "৫:৫৯" },
            { no: "১৪", date: "০৪ মার্চ", day: "বুধবার", sehri: "৪:৫৫", iftar: "৫:৫৯" },
            { no: "১৫", date: "০৫ মার্চ", day: "বৃহস্পতিবার", sehri: "৪:৫৪", iftar: "৬:০০" },
            { no: "১৬", date: "০৬ মার্চ", day: "শুক্রবার", sehri: "৪:৫৩", iftar: "৬:০০" },
            { no: "১৭", date: "০৭ মার্চ", day: "শনিবার", sehri: "৪:৫২", iftar: "৬:০১" },
            { no: "১৮", date: "০৮ মার্চ", day: "রবিবার", sehri: "৪:৫普及", iftar: "৬:০১" },
            { no: "১৯", date: "০৯ মার্চ", day: "সোমবার", sehri: "৪:৫০", iftar: "৬:০২" },
            { no: "২০", date: "১০ মার্চ", day: "মঙ্গলবার", sehri: "৪:৪৯", iftar: "৬:০২" },
            { no: "২১", date: "১১ মার্চ", day: "বুধবার", sehri: "৪:৪৮", iftar: "৬:০২" },
            { no: "২২", date: "১২ মার্চ", day: "বৃহস্পতিবার", sehri: "৪:৪৭", iftar: "৬:০৩" },
            { no: "২৩", date: "১৩ মার্চ", day: "শুক্রবার", sehri: "৪:৪৬", iftar: "৬:০৩" },
            { no: "২৪", date: "১৪ মার্চ", day: "শনিবার", sehri: "৪:৪৫", iftar: "৬:০৪" },
            { no: "২৫", date: "১৫ মার্চ", day: "রবিবার", sehri: "৪:৪৪", iftar: "৬:০৪" },
            { no: "২৬", date: "১৬ মার্চ", day: "সোমবার", sehri: "৪:৪৩", iftar: "৬:০৫" },
            { no: "২৭", date: "১৭ মার্চ", day: "মঙ্গলবার", sehri: "৪:৪২", iftar: "৬:০৫" },
            { no: "২৮", date: "১৮ মার্চ", day: "বুধবার", sehri: "৪:৪১", iftar: "৬:০৫" },
            { no: "২৯", date: "১৯ মার্চ", day: "বৃহস্পতিবার", sehri: "৪:৪০", iftar: "৬:০৬" },
            { no: "৩০", date: "২০ মার্চ", day: "শুক্রবার", sehri: "৪:৩৯", iftar: "৬:০৬" }
        ];

        // আজকের ইনডেক্স খুঁজে বের করা (সিস্টেম ডেট অনুযায়ী)
        const now = new Date();
        const banglaDateStr = now.toLocaleDateString('bn-BD', {day:'numeric', month:'long'});
        let currentIdx = ramadanData.findIndex(d => d.date.includes(banglaDateStr.split(' ')[0]));
        if(currentIdx === -1) currentIdx = 0; // যদি রমজানের বাইরে হয় তবে ১ম দিন দেখাবে

        function init() {
            const pcBody = document.getElementById('pc-body');
            const mobileList = document.getElementById('mobile-list');
            
            ramadanData.forEach((item, i) => {
                const isActive = (i === currentIdx);
                const activeClass = isActive ? 'active-day' : '';
                const activeID = isActive ? 'id="today-marker"' : '';

                // PC Table Row
                pcBody.innerHTML += `
                    <tr ${activeID} class="border-b transition-all ${activeClass}">
                        <td class="p-4 font-bold text-emerald-700">${item.no}</td>
                        <td class="p-4 text-sm">${item.date}</td>
                        <td class="p-4 text-sm">${item.day}</td>
                        <td class="p-4 text-red-600 font-semibold">${item.sehri} AM</td>
                        <td class="p-4 text-emerald-600 font-semibold">${item.iftar} PM</td>
                    </tr>
                `;

                // Mobile Card
                mobileList.innerHTML += `
                    <div ${activeID} class="glass p-4 rounded-2xl flex justify-between items-center shadow-sm border border-gray-100 transition-all ${activeClass}">
                        <div>
                            <span class="text-[10px] text-emerald-600 font-bold uppercase tracking-widest">রমজান ${item.no}</span>
                            <h3 class="font-bold text-slate-800">${item.date}, ${item.day}</h3>
                        </div>
                        <div class="text-right">
                            <div class="text-xs text-red-500">সাহরী: <span class="font-bold">${item.sehri}</span></div>
                            <div class="text-xs text-emerald-600">ইফতার: <span class="font-bold">${item.iftar}</span></div>
                        </div>
                    </div>
                `;
            });

            // টপ কার্ড আপডেট
            const todayData = ramadanData[currentIdx];
            document.getElementById('top-date').innerText = todayData.date;
            document.getElementById('top-sehri').innerText = todayData.sehri + " AM";
            document.getElementById('top-iftar').innerText = todayData.iftar + " PM";
        }

        function scrollToToday() {
            document.getElementById('today-marker').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        // লাইভ আপডেট ও কাউন্টডাউন
        setInterval(() => {
            const d = new Date();
            document.getElementById('live-clock').innerText = d.toLocaleTimeString('bn-BD');
            
            // ইফতার কাউন্টডাউন লজিক (সংক্ষেপে)
            const target = ramadanData[currentIdx].iftar.split(':');
            const iftarTime = new Date();
            iftarTime.setHours(parseInt(target[0])+12, parseInt(target[1]), 0);
            
            let diff = iftarTime - d;
            if(diff < 0) diff = 0;
            
            const h = Math.floor(diff/3600000);
            const m = Math.floor((diff%3600000)/60000);
            const s = Math.floor((diff%60000)/1000);
            document.getElementById('countdown').innerText = `${h}:${m}:${s}`;
        }, 1000);

        function toggleNotification() {
            alert("নোটিফিকেশন ফিচারটি ২০২৬ সালের রমজানের ঠিক আগে সচল হবে।");
        }

        init();
    </script>
</body>
</html>
